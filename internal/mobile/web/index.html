<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#090d16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AIO">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='14' fill='%23090d16' stroke='%23334155' stroke-width='2'/%3E%3Cpath d='M32 14 L50 32 L32 50 L14 32 Z' fill='%230f172a' stroke='%2338bdf8' stroke-width='3'/%3E%3Cpath d='M26 27 L32 32 L26 37' fill='none' stroke='%23f8fafc' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cline x1='34' y1='37' x2='40' y2='37' stroke='%2334d399' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<title>AIO Mobile</title>
<style>
  :root {
    --bg: #090d16;
    --bg-elev: #0e1422;
    --card: #131b2e;
    --card-hi: #1a243d;
    --pill: #151e32;
    --border: rgba(255, 255, 255, 0.08);
    --border-hi: rgba(56, 189, 248, 0.42);
    --text: #eef2f8;
    --soft: #c5d1e2;
    --muted: #7c8ca6;
    --sky: #38bdf8;
    --sky-deep: #0284c7;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
    --purple: #c084fc;
    --orange: #fb923c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  svg.ico {
    width: 18px; height: 18px; stroke: currentColor; fill: none;
    stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round;
    flex-shrink: 0; display: block;
  }
  svg.ico-sm { width: 15px; height: 15px; }
  svg.ico-lg { width: 20px; height: 20px; }

  .app {
    display: flex; flex-direction: column;
    height: 100dvh; width: 100%; overflow: hidden;
    padding-top: env(safe-area-inset-top);
    background: var(--bg);
  }

  /* --- Top Header (Minimal iOS Glass Bar) --- */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; min-height: 52px;
    background: rgba(9, 13, 22, 0.86);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0; z-index: 10;
  }
  .brand-btn {
    width: 32px; height: 32px; border-radius: 10px; border: none; padding: 0;
    background: linear-gradient(135deg, rgba(56,189,248,0.18), rgba(52,211,153,0.14));
    box-shadow: inset 0 0 0 1px rgba(56,189,248,0.28);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--sky); cursor: pointer; flex-shrink: 0; position: relative;
  }
  .brand-btn:active { transform: scale(0.94); }
  .badge-count {
    position: absolute; top: -4px; right: -4px;
    min-width: 16px; height: 16px; padding: 0 4px;
    border-radius: 999px; background: var(--amber); color: #090d16;
    font-size: 10px; font-weight: 800; display: none;
    align-items: center; justify-content: center;
  }
  .badge-count.show { display: flex; }

  .run-head {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px;
    cursor: pointer; padding: 2px 4px; border-radius: 10px;
  }
  .run-head:active { background: rgba(255,255,255,0.05); }
  .run-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .run-main {
    display: flex; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden;
  }
  .run-title { overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
  .run-sub {
    font-size: 11px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .agent-chip {
    font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
    background: rgba(56,189,248,0.14); color: var(--sky); flex-shrink: 0;
    letter-spacing: 0.01em;
  }
  .agent-chip.claude { background: rgba(251,146,60,0.16); color: var(--orange); }
  .agent-chip.codex { background: rgba(52,211,153,0.16); color: var(--green); }
  .agent-chip.agy { background: rgba(56,189,248,0.16); color: var(--sky); }
  .agent-chip.cursor { background: rgba(192,132,252,0.16); color: var(--purple); }
  .agent-chip.kimi { background: rgba(251,191,36,0.16); color: var(--amber); }
  .agent-chip.opencode { background: rgba(244,114,182,0.16); color: #f472b6; }

  .dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--muted);
  }
  .dot.running, .dot.starting { background: var(--sky); box-shadow: 0 0 0 0 rgba(56,189,248,0.65); animation: pulse 1.8s infinite; }
  .dot.waiting_input { background: var(--amber); box-shadow: 0 0 0 0 rgba(251,191,36,0.65); animation: pulse 1.4s infinite; }
  .dot.done { background: var(--green); }
  .dot.error { background: var(--red); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 currentColor; opacity: 1; }
    70% { box-shadow: 0 0 0 6px transparent; opacity: 0.9; }
    100% { box-shadow: 0 0 0 0 transparent; opacity: 1; }
  }

  .top-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .ghost-btn {
    height: 30px; padding: 0 9px; border-radius: 999px; border: none;
    background: rgba(255, 255, 255, 0.06); color: var(--soft);
    font-size: 11.5px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    white-space: nowrap;
  }
  .ghost-btn:active { background: rgba(255, 255, 255, 0.12); color: var(--text); }

  .icon-btn {
    height: 34px; min-width: 34px; padding: 0 12px;
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--soft);
    font-size: 12.5px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    white-space: nowrap; flex-shrink: 0;
  }
  .icon-btn:active { background: var(--card-hi); color: var(--text); }
  .icon-btn.active { border-color: var(--border-hi); color: var(--sky); background: rgba(56,189,248,0.12); }
  .btn-primary {
    background: linear-gradient(135deg, #38bdf8, #0284c7);
    border: none; color: #fff; font-weight: 700;
  }
  .btn-primary:active { filter: brightness(0.92); }
  .btn-danger { background: rgba(248,113,113,0.16); border: 1px solid rgba(248,113,113,0.4); color: var(--red); }

  /* --- Alert / Waiting Banner --- */
  .alert-banner {
    display: none; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 14px; background: rgba(251, 191, 36, 0.12);
    border-bottom: 1px solid rgba(251, 191, 36, 0.28);
    color: var(--amber); font-size: 12.5px; font-weight: 600; flex-shrink: 0;
  }
  .alert-banner.show { display: flex; }
  .alert-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .mini-pill {
    padding: 4px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 700;
    border: 1px solid rgba(255,255,255,0.14); background: rgba(15,23,42,0.8);
    color: var(--text); cursor: pointer;
  }
  .mini-pill.ok { background: var(--green); border-color: var(--green); color: #042414; }
  .mini-pill:active { transform: scale(0.95); }

  /* --- Main Views --- */
  .views { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; overflow: hidden; }
  .view { display: none; flex: 1; min-height: 0; flex-direction: column; overflow: hidden; }
  .view.active { display: flex; }

  /* --- Terminal View --- */
  .term-body {
    flex: 1; min-height: 0; position: relative;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .screen-wrap {
    flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch; touch-action: pan-y;
    overscroll-behavior-y: contain;
    background: var(--bg); position: relative;
    padding: 12px 16px 26px; width: 100%; max-width: 100%;
  }
  .screen-wrap.mode-raw { overflow-x: auto; touch-action: pan-x pan-y; }
  .screen-wrap.mode-fit { overflow-x: hidden; touch-action: pan-y; padding: 10px 10px 24px; }
  .screen-stage {
    position: relative; width: 100%; max-width: 100%; overflow: hidden;
  }
  .screen-wrap.mode-raw .screen-stage {
    display: inline-block; width: auto; max-width: none; overflow: visible;
  }
  #screen {
    margin: 0;
    font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
    font-size: 12.5px; line-height: 1.56; white-space: pre; color: #dbe4f3; tab-size: 4;
    transform-origin: top left;
  }
  .screen-wrap.mode-wrap #screen {
    white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
    width: 100%; max-width: 100%; transform: none !important;
  }
  .term-hr {
    display: block; height: 1px; width: 100%; margin: 8px 0;
    background: linear-gradient(90deg, rgba(148,163,184,0.22), rgba(148,163,184,0.08));
  }

  .scroll-fab {
    position: absolute; right: 14px; bottom: 14px; z-index: 6;
    display: none; align-items: center; gap: 5px;
    padding: 7px 13px; border-radius: 999px;
    background: rgba(19, 27, 46, 0.94); color: var(--sky);
    border: 1px solid rgba(56,189,248,0.38);
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .scroll-fab.show { display: inline-flex; }
  .scroll-fab:active { transform: scale(0.95); }

  /* --- Add-to-Home-Screen guide sheet --- */
  .guide-overlay {
    position: fixed; inset: 0; z-index: 60; display: none;
    align-items: flex-end; justify-content: center;
    background: rgba(2, 6, 14, 0.62);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .guide-overlay.show { display: flex; }
  .guide-sheet {
    width: 100%; max-width: 480px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    padding: 20px 20px calc(18px + env(safe-area-inset-bottom));
    box-shadow: 0 -12px 40px rgba(0,0,0,0.5);
  }
  .guide-title { font-size: 16px; font-weight: 800; margin-bottom: 8px; }
  .guide-reason { margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.55; }
  .guide-steps { margin: 0 0 16px; padding-left: 20px; color: var(--soft); font-size: 14px; line-height: 1.9; }
  .guide-steps b { color: var(--text); }
  .g-ico { color: var(--sky); font-weight: 700; }
  .guide-ok { width: 100%; height: 42px; border-radius: 12px; font-size: 14px; }

  .dormant-card {
    margin: 28px auto; max-width: 330px; padding: 22px 18px; text-align: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.35);
  }
  .dormant-card h3 { margin: 0 0 6px; font-size: 15.5px; }
  .dormant-card p { margin: 0 0 16px; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .dormant-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .dormant-btns .icon-btn { height: 38px; padding: 0 16px; font-size: 13px; border-radius: 12px; }

  /* --- Collapsible Quick Keys Dock --- */
  .keys-dock {
    display: none; flex-direction: column; gap: 7px;
    padding: 9px 12px; background: var(--bg-elev);
    border-top: 1px solid var(--border); flex-shrink: 0;
  }
  .keys-dock.open { display: flex; }
  .keys-row {
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  }
  .keys-row::-webkit-scrollbar { display: none; }
  .kbtn {
    background: var(--card); color: var(--soft); border: 1px solid var(--border);
    border-radius: 10px; padding: 7px 11px; font-size: 12px; font-weight: 600;
    font-family: ui-monospace, -apple-system, sans-serif;
    flex-shrink: 0; cursor: pointer; min-width: 40px; text-align: center;
  }
  .kbtn:active { background: var(--sky); color: #051120; border-color: var(--sky); }
  .kbtn.warn { color: var(--amber); border-color: rgba(251,191,36,0.28); }
  .kbtn.danger { color: var(--red); border-color: rgba(248,113,113,0.28); }

  /* --- Unified Pill Composer Bar (ChatGPT / Cursor Mobile Style) --- */
  .composer-wrap {
    background: var(--bg);
    padding: 8px 12px 6px; flex-shrink: 0;
    border-top: 1px solid var(--border);
  }
  .composer-pill {
    display: flex; align-items: flex-end; gap: 4px;
    background: var(--pill);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 22px;
    padding: 4px 5px 4px 6px;
    transition: border-color 0.15s;
  }
  .composer-pill:focus-within {
    border-color: rgba(56, 189, 248, 0.5);
  }
  .c-ghost {
    width: 34px; height: 34px; border-radius: 50%;
    border: none; background: transparent; color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; transition: all 0.15s;
  }
  .c-ghost:active { background: rgba(255,255,255,0.08); color: var(--text); }
  .c-ghost.active { color: var(--sky); background: rgba(56,189,248,0.14); }
  .c-ghost.recording {
    color: var(--red); background: rgba(248,113,113,0.18);
    animation: pulse 1.2s infinite;
  }
  .c-send {
    width: 34px; height: 34px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #38bdf8, #0284c7); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; transition: transform 0.12s;
  }
  .c-send:active { transform: scale(0.92); }
  #prompt {
    flex: 1; min-width: 0; background: transparent; color: var(--text);
    border: none; padding: 7px 6px; font-size: 15px; line-height: 1.35;
    min-height: 34px; max-height: 110px; resize: none; outline: none;
    font-family: inherit;
  }
  #prompt::placeholder { color: #64748b; }

  /* --- Clean Bottom Tab Navigation --- */
  .tabbar {
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: rgba(9, 13, 22, 0.96);
    border-top: 1px solid var(--border);
    padding: 5px 8px calc(5px + env(safe-area-inset-bottom));
    flex-shrink: 0;
  }
  .app.kbd-open .tabbar { display: none; }
  .app.kbd-open .composer-wrap { padding-bottom: 8px; }
  .tab {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; padding: 4px 0; border: none; background: none;
    color: var(--muted); font-size: 10px; font-weight: 600; cursor: pointer;
    position: relative; transition: color 0.15s;
  }
  .tab.active { color: var(--sky); }
  .tab-dot {
    position: absolute; top: 3px; right: calc(50% - 14px);
    width: 6px; height: 6px; border-radius: 50%; background: var(--amber); display: none;
  }
  .tab-dot.show { display: block; }

  /* --- Scrollable Card Pages (Tasks / Diff / Quota) --- */
  .page-scroll {
    flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 14px 14px 28px;
  }
  .page-title-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .page-title { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }

  .stat-strip {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px;
  }
  .stat-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 11px 10px; text-align: center; cursor: pointer;
  }
  .stat-box.active { border-color: var(--border-hi); background: rgba(56,189,248,0.1); }
  .stat-num { font-size: 19px; font-weight: 800; line-height: 1.1; }
  .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 3px; }

  .sec-head {
    display: flex; align-items: center; justify-content: space-between;
    margin: 16px 2px 8px; font-size: 12px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.03em;
  }
  .sec-sub { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: none; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 13px; margin-bottom: 10px;
  }
  .task-title-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-bottom: 8px;
  }
  .task-title { font-size: 14px; font-weight: 700; color: var(--text); }
  .task-mode {
    font-size: 10.5px; color: var(--muted); background: rgba(255,255,255,0.06);
    padding: 2px 8px; border-radius: 999px;
  }
  .run-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 11px; margin-top: 6px; border-radius: 12px;
    background: rgba(9, 13, 22, 0.55); border: 1px solid transparent; cursor: pointer;
  }
  .run-row.selected { border-color: var(--border-hi); background: rgba(56,189,248,0.09); }
  .run-row:active { background: var(--card-hi); }
  .run-row-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .run-row-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .status-pill {
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: rgba(148,163,184,0.14); color: var(--muted);
  }
  .status-pill.running, .status-pill.starting { background: rgba(56,189,248,0.16); color: var(--sky); }
  .status-pill.waiting_input { background: rgba(251,191,36,0.2); color: var(--amber); }
  .status-pill.done { background: rgba(52,211,153,0.16); color: var(--green); }
  .status-pill.error { background: rgba(248,113,113,0.18); color: var(--red); }

  /* --- Quota Cards --- */
  .quota-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .quota-sum { font-size: 13.5px; font-weight: 700; }
  .bar-track {
    height: 7px; border-radius: 999px; background: rgba(255,255,255,0.08);
    overflow: hidden; margin: 6px 0 9px;
  }
  .bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #34d399, #38bdf8); transition: width 0.3s; }
  .bar-fill.low { background: linear-gradient(90deg, #fbbf24, #f97316); }
  .bar-fill.limited { background: var(--red); }
  .quota-detail {
    font-size: 11.5px; color: var(--muted); line-height: 1.55;
    white-space: pre-wrap; font-family: ui-monospace, monospace;
  }

  /* --- Diff Viewer --- */
  .diff-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; }
  .diff-file {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 12px;
    font-family: ui-monospace, monospace;
  }
  .diff-file:last-child { border-bottom: none; }
  .diff-code {
    margin: 0; padding: 12px; border-radius: 14px; background: #060a12;
    border: 1px solid var(--border); overflow-x: auto;
    font-family: ui-monospace, monospace; font-size: 11.5px; line-height: 1.5;
  }
  .dl-add { color: #4ade80; background: rgba(34,197,94,0.12); display: block; }
  .dl-del { color: #f87171; background: rgba(239,68,68,0.12); display: block; }
  .dl-hunk { color: #38bdf8; display: block; font-weight: 700; }
  .dl-ctx { color: #cbd5e1; display: block; }

  /* --- Bottom Sheets (Voice / New Task) --- */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(2, 6, 23, 0.72);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    z-index: 30; display: none; align-items: flex-end; justify-content: center;
  }
  .sheet-backdrop.open { display: flex; }
  .sheet {
    width: 100%; max-width: 520px; max-height: 86dvh;
    background: var(--bg-elev); border-top: 1px solid rgba(255,255,255,0.12);
    border-radius: 22px 22px 0 0;
    padding: 12px 16px calc(18px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 12px; overflow-y: auto;
    box-shadow: 0 -16px 44px rgba(0,0,0,0.6);
  }
  .sheet-handle {
    width: 36px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.2);
    margin: 0 auto 2px;
  }
  .sheet-title {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 15.5px; font-weight: 800;
  }

  /* --- Voice Visualizer --- */
  .voice-wave {
    display: flex; align-items: center; justify-content: center; gap: 5px; height: 42px;
  }
  .voice-bar {
    width: 4px; height: 10px; border-radius: 999px;
    background: linear-gradient(180deg, #38bdf8, #34d399);
    animation: wave 0.9s ease-in-out infinite;
  }
  .voice-bar:nth-child(2) { animation-delay: 0.12s; }
  .voice-bar:nth-child(3) { animation-delay: 0.24s; }
  .voice-bar:nth-child(4) { animation-delay: 0.36s; }
  .voice-bar:nth-child(5) { animation-delay: 0.48s; }
  .voice-wave.idle .voice-bar { animation: none; height: 7px; opacity: 0.3; }
  @keyframes wave {
    0%, 100% { height: 9px; }
    50% { height: 36px; }
  }
  .voice-box {
    min-height: 76px; padding: 12px 14px; border-radius: 14px;
    background: var(--bg); border: 1px solid var(--border);
    font-size: 15px; line-height: 1.5; color: var(--text);
    white-space: pre-wrap; word-break: break-word;
  }
  .voice-interim { color: var(--sky); opacity: 0.85; }
  .voice-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .switch-lbl { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--soft); cursor: pointer; }
  .tip-card {
    background: rgba(56,189,248,0.08); border: 1px solid rgba(56,189,248,0.22);
    border-radius: 14px; padding: 12px 13px; font-size: 12.5px; color: var(--soft); line-height: 1.6;
  }
  .tip-card strong { color: var(--sky); }

  /* --- Form Fields (New Task Sheet) --- */
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--sky); }
  .chip-group { display: flex; flex-wrap: wrap; gap: 7px; }
  .check-chip {
    padding: 7px 12px; border-radius: 10px; font-size: 13px; font-weight: 600;
    background: var(--card); border: 1px solid var(--border); color: var(--soft); cursor: pointer;
  }
  .check-chip.on { background: rgba(56,189,248,0.18); border-color: var(--sky); color: #fff; }
  .check-chip.disabled { opacity: 0.38; pointer-events: none; }

  .toast {
    position: fixed; top: calc(58px + env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%) translateY(-10px); opacity: 0; pointer-events: none;
    background: rgba(19, 27, 46, 0.96); color: var(--text);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 999px;
    padding: 7px 14px; font-size: 12px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45); transition: all 0.2s; z-index: 50;
    max-width: 90vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .empty-state {
    text-align: center; padding: 38px 16px; color: var(--muted); font-size: 13.5px; line-height: 1.6;
  }

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const appEl = $("app");
  const screenEl = $("screen");
  const screenStage = $("screenStage");
  const screenWrap = $("screenWrap");
  const dormantBox = $("dormantBox");
  const promptEl = $("prompt");
  const scrollFab = $("scrollFab");
  const scrollFabText = $("scrollFabText");

  let state = { projects: [], tasks: [], runs: [], agents: [], quotas: [] };
  let caps = { https: location.protocol === "https:", voice_transcribe: false };
  let activeRunID = "";
  let activeTab = "term";
  let taskFilter = "all";
  let ptyWS = null;
  let evWS = null;
  let ptyScrollOffset = 0;
  let lastRawScreen = "";
  let diffCache = null;
  let diffRunIdx = 0;

  // Rock-solid scroll state machine so the very first upward swipe NEVER snaps back to bottom!
  let userPinBottom = true;
  let isTouching = false;
  let touchStartY = 0;
  let lastKnownScrollTop = 0;
  let programmaticScroll = false;
  let pendingScreenMsg = null;
  let flushTimer = null;

  const viewModes = ["wrap", "fit", "raw"];
  const viewModeLabels = { wrap: "屏宽", fit: "缩放", raw: "原宽" };
  let viewMode = localStorage.getItem("aio_m_view_v2") || "wrap";
  if (!viewModes.includes(viewMode)) viewMode = "wrap";

  const fontSizes = [11.5, 13, 14.5];
  let fontIdx = Number(localStorage.getItem("aio_m_font") || 1);
  if (isNaN(fontIdx) || fontIdx < 0 || fontIdx >= fontSizes.length) fontIdx = 1;

  const statusText = {
    starting: "启动中", running: "运行中", waiting_input: "待确认",
    done: "完成", error: "出错", stopped: "停止"
  };

  // --- Toast ---
  let toastTimer = null;
  function showToast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
  }

  // --- Auth Session Token (Per-Device Session Meta + Cookie + Bearer + WS Token) ---
  const UA = navigator.userAgent || "";
  const isIOS = /iPhone|iPad|iPod/i.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isWeChat = /MicroMessenger/i.test(UA);
  const isStandalone = window.navigator.standalone === true ||
    (window.matchMedia && (matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches));

  let authToken = "";
  let sessionRevoked = false;
  try {
    const metaSess = document.querySelector('meta[name="aio-session"]');
    const sTok = metaSess ? (metaSess.getAttribute("content") || "").trim() : "";
    const qTok = new URLSearchParams(location.search).get("token");
    if (sTok) {
      authToken = sTok;
      sessionStorage.setItem("aio_m_tok", authToken);
      if (isIOS && !isStandalone) {
        // Keep the per-device session token (never the QR pairing token) in the URL on iOS
        // so "Add to Home Screen" bookmarks an authenticated URL for its isolated cookie jar.
        try { history.replaceState(null, "", "/?token=" + encodeURIComponent(sTok)); } catch (_) {}
      } else if (qTok) {
        try { history.replaceState(null, "", "/"); } catch (_) {}
      }
    } else if (qTok) {
      authToken = qTok.trim();
      sessionStorage.setItem("aio_m_tok", authToken);
      if (!isIOS && location.protocol !== "https:") {
        history.replaceState(null, "", "/");
      }
    } else {
      authToken = sessionStorage.getItem("aio_m_tok") || "";
    }
  } catch (_) {}

  function handleSessionRevoked() {
    if (sessionRevoked) return;
    sessionRevoked = true;
    try { sessionStorage.removeItem("aio_m_tok"); } catch (_) {}
    authToken = "";
    if (evWS) { try { evWS.close(); } catch (_) {} evWS = null; }
    if (ptyWS) { try { ptyWS.close(); } catch (_) {} ptyWS = null; }
    $("runTitle").textContent = "会话已失效";
    $("runSub").textContent = "请在桌面端重新扫码登录";
    screenStage.style.display = "none";
    $("dormantBox").querySelector("h3").textContent = "当前手机会话已失效";
    $("dormantDesc").textContent = "该设备已被桌面端踢出或二维码 Token 已刷新，请重新扫码连接。";
    $("resumeBtn").style.display = "none";
    $("freshBtn").style.display = "none";
    dormantBox.style.display = "block";
    showToast("会话已失效，请重新扫码");
  }

  async function apiFetch(url, opts) {
    const o = Object.assign({ credentials: "same-origin" }, opts || {});
    const headers = Object.assign({}, o.headers || {});
    if (authToken) headers["Authorization"] = "Bearer " + authToken;
    o.headers = headers;
    const res = await fetch(url, o);
    if (res.status === 401) {
      handleSessionRevoked();
    }
    return res;
  }

  function wsURL(path) {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    let full = proto + "//" + location.host + path;
    if (authToken) {
      full += (full.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(authToken);
    }
    return full;
  }

  // --- Keyboard-aware Viewport Handling ---
  function syncViewportHeight() {
    if (window.visualViewport) {
      const vh = window.visualViewport.height;
      appEl.style.height = vh + "px";
      const kbdOpen = window.innerHeight - vh > 140;
      appEl.classList.toggle("kbd-open", kbdOpen);
      window.scrollTo(0, 0);
    }
    applyTerminalScale();
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", syncViewportHeight);
    window.visualViewport.addEventListener("scroll", () => window.scrollTo(0, 0));
  }
  window.addEventListener("resize", syncViewportHeight);

  // --- Touch & Scroll Tracking (Zero Snap-Back on First Swipe) ---
  function distFromBottom() {
    return screenWrap.scrollHeight - screenWrap.scrollTop - screenWrap.clientHeight;
  }

  screenWrap.addEventListener("touchstart", (e) => {
    isTouching = true;
    if (e.touches && e.touches.length > 0) {
      touchStartY = e.touches[0].clientY;
    }
  }, { passive: true });

  screenWrap.addEventListener("touchmove", (e) => {
    if (e.touches && e.touches.length > 0) {
      const dy = e.touches[0].clientY - touchStartY;
      // Finger dragging downward means scrolling UP into history -> immediately unpin!
      if (dy > 4) {
        userPinBottom = false;
        updateScrollFab();
      }
    }
  }, { passive: true });

  function finishTouch() {
    if (!isTouching) return;
    isTouching = false;
    clearTimeout(flushTimer);
    // Flush any deferred terminal frame after touch lifts so iOS momentum stays silky.
    flushTimer = setTimeout(() => {
      if (!isTouching && pendingScreenMsg) {
        const msg = pendingScreenMsg;
        pendingScreenMsg = null;
        renderScreenFrame(msg, false);
      }
    }, 140);
  }
  screenWrap.addEventListener("touchend", finishTouch, { passive: true });
  screenWrap.addEventListener("touchcancel", finishTouch, { passive: true });

  screenWrap.addEventListener("scroll", () => {
    const top = screenWrap.scrollTop;
    if (!programmaticScroll) {
      if (top < lastKnownScrollTop - 2) {
        userPinBottom = false;
      } else if (distFromBottom() <= 16) {
        userPinBottom = true;
      }
    }
    lastKnownScrollTop = top;
    updateScrollFab();
  }, { passive: true });

  // --- Utilities & ANSI Renderer ---
  function b64EncodeUTF8(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = "";
    for (const b of bytes) bin += String.fromCharCode(b);
    return btoa(bin);
  }
  function escapeHTML(s) {
    return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  const ansi16 = [
    "#1e293b","#f87171","#34d399","#fbbf24","#60a5fa","#c084fc","#22d3ee","#e2e8f0",
    "#64748b","#fca5a5","#4ade80","#fde047","#93c5fd","#d8b4fe","#67e8f9","#f8fafc"
  ];
  function color256(n) {
    if (n < 16) return ansi16[n] || "#e2e8f0";
    if (n >= 232) { const g = 8 + (n - 232) * 10; return `rgb(${g},${g},${g})`; }
    n -= 16;
    const r = Math.floor(n / 36), g = Math.floor((n % 36) / 6), b = n % 6;
    const v = (x) => (x === 0 ? 0 : 55 + x * 40);
    return `rgb(${v(r)},${v(g)},${v(b)})`;
  }
  function ansiLineToHTML(input) {
    const clean = input.replace(/\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)/g, "");
    const re = /\x1b\[([0-9;]*)m/g;
    let out = "", last = 0, fg = "", bg = "", bold = false, dim = false, ul = false, rev = false;
    function openSpan() {
      const st = [];
      const effFg = rev ? (bg || "#090d16") : fg;
      const effBg = rev ? (fg || "#e2e8f0") : bg;
      if (effFg) st.push("color:" + effFg);
      if (effBg) st.push("background:" + effBg);
      if (bold) st.push("font-weight:700");
      if (dim) st.push("opacity:0.6");
      if (ul) st.push("text-decoration:underline");
      return st.length ? `<span style="${st.join(";")}">` : "";
    }
    let spanOpen = false, m;
    while ((m = re.exec(clean)) !== null) {
      if (m.index > last) out += escapeHTML(clean.slice(last, m.index));
      last = re.lastIndex;
      if (spanOpen) { out += "</span>"; spanOpen = false; }
      const codes = m[1] === "" ? [0] : m[1].split(";").map(Number);
      for (let i = 0; i < codes.length; i++) {
        const c = codes[i];
        if (c === 0) { fg = ""; bg = ""; bold = dim = ul = rev = false; }
        else if (c === 1) bold = true;
        else if (c === 2) dim = true;
        else if (c === 4) ul = true;
        else if (c === 7) rev = true;
        else if (c === 22) { bold = false; dim = false; }
        else if (c === 24) ul = false;
        else if (c === 27) rev = false;
        else if (c === 39) fg = "";
        else if (c === 49) bg = "";
        else if (c >= 30 && c <= 37) fg = ansi16[c - 30];
        else if (c >= 90 && c <= 97) fg = ansi16[c - 90 + 8];
        else if (c >= 40 && c <= 47) bg = ansi16[c - 40];
        else if (c >= 100 && c <= 107) bg = ansi16[c - 100 + 8];
        else if (c === 38 && codes[i + 1] === 5 && i + 2 < codes.length) { fg = color256(codes[i + 2]); i += 2; }
        else if (c === 48 && codes[i + 1] === 5 && i + 2 < codes.length) { bg = color256(codes[i + 2]); i += 2; }
        else if (c === 38 && codes[i + 1] === 2 && i + 4 < codes.length) { fg = `rgb(${codes[i+2]},${codes[i+3]},${codes[i+4]})`; i += 4; }
        else if (c === 48 && codes[i + 1] === 2 && i + 4 < codes.length) { bg = `rgb(${codes[i+2]},${codes[i+3]},${codes[i+4]})`; i += 4; }
      }
      const tag = openSpan();
      if (tag) { out += tag; spanOpen = true; }
    }
    if (last < clean.length) out += escapeHTML(clean.slice(last));
    if (spanOpen) out += "</span>";
    return out;
  }

  // Convert ANSI screen into crisp mobile HTML: in wrap mode, pure ASCII horizontal rules become
  // full-width hairline dividers instead of awkward half-width or wrapped dashes.
  function renderTerminalHTML(raw) {
    let lines = raw.split("\n");
    const stripANSI = (s) => s.replace(/\x1b\[[0-9;]*m/g, "").replace(/\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)/g, "");
    while (lines.length > 0 && stripANSI(lines[lines.length - 1]).trim() === "") lines.pop();
    while (lines.length > 0 && stripANSI(lines[0]).trim() === "") lines.shift();

    if (viewMode !== "wrap") {
      return ansiLineToHTML(lines.join("\n"));
    }
    const pureRuleRe = /^[─━═\-_┄┈╌╍]{12,}$/;
    const out = [];
    for (const l of lines) {
      const trimmed = l.replace(/[ \t]+$/, "");
      const plain = stripANSI(trimmed).trim();
      if (pureRuleRe.test(plain)) {
        out.push(`<span class="term-hr"></span>`);
      } else {
        out.push(ansiLineToHTML(trimmed));
      }
    }
    return out.join("\n");
  }

  function applyTerminalScale() {
    $("viewModeBtn").textContent = viewModeLabels[viewMode];
    screenEl.style.fontSize = fontSizes[fontIdx] + "px";
    screenWrap.classList.toggle("mode-wrap", viewMode === "wrap");
    screenWrap.classList.toggle("mode-fit", viewMode === "fit");
    screenWrap.classList.toggle("mode-raw", viewMode === "raw");

    screenEl.style.transform = "";
    screenStage.style.height = "";
    screenStage.style.width = "";

    if (viewMode === "wrap") {
      screenWrap.scrollLeft = 0;
      return;
    }
    if (viewMode === "fit") {
      screenWrap.scrollLeft = 0;
      const availW = Math.max(200, screenWrap.clientWidth - 20);
      const contentW = screenEl.scrollWidth;
      if (contentW > availW + 2) {
        const scale = Math.max(0.32, availW / contentW);
        screenEl.style.transform = `scale(${scale.toFixed(4)})`;
        screenStage.style.width = availW + "px";
        screenStage.style.height = Math.ceil(screenEl.scrollHeight * scale) + "px";
      }
    }
  }

  // --- Fullscreen / Immersive Mode (Native Fullscreen API + iOS Safari Immersive Fallback) ---
  // --- Browser-Chrome Fullscreen (hide the browser address bar + bottom toolbar) ---
  // 1. Android Chrome / Edge / Firefox / desktop: native Fullscreen API hides address bar & bottom bar.
  // 2. iPhone (ALL browsers use Apple WebKit without Element.requestFullscreen):
  //    - True zero-chrome fullscreen requires "Add to Home Screen" (HTTP recommended on LAN because
  //      iOS standalone Web.app does not inherit Safari's temporary self-signed TLS bypass).
  //    - Inside Safari directly, users can also tap "aA / 大小" -> "隐藏工具栏".
  function nativeFullscreenElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement || null;
  }
  function nativeFullscreenSupported() {
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    const enabled = document.fullscreenEnabled || document.webkitFullscreenEnabled || document.mozFullScreenEnabled || document.msFullscreenEnabled;
    return typeof fn === "function" && enabled !== false && !isIOS;
  }

  function syncFsButton() {
    const on = !!nativeFullscreenElement();
    $("fsBtn").classList.toggle("active", on);
    $("fsBtn").title = on ? "退出全屏" : "全屏（隐藏浏览器地址栏与底部栏）";
  }

  async function enterBrowserFullscreen() {
    const el = document.documentElement;
    const reqFn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    try {
      let res;
      try { res = reqFn.call(el, { navigationUI: "hide" }); } catch (_) { res = reqFn.call(el); }
      if (res && typeof res.then === "function") await res;
    } catch (_) {}
    if (!nativeFullscreenElement()) {
      openInstallGuide();
    }
  }

  async function exitBrowserFullscreen() {
    const exitFn = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
    if (typeof exitFn === "function") {
      try {
        const res = exitFn.call(document);
        if (res && typeof res.then === "function") await res;
      } catch (_) {}
    }
  }

  // --- PTY WebSocket & Flicker-Free Scroll Rendering ---
  function scrollToBottomNow(smooth) {
    userPinBottom = true;
    programmaticScroll = true;
    if (smooth) {
      screenWrap.scrollTo({ top: screenWrap.scrollHeight, behavior: "smooth" });
    } else {
      screenWrap.scrollTop = screenWrap.scrollHeight;
    }
    lastKnownScrollTop = screenWrap.scrollTop;
    setTimeout(() => { programmaticScroll = false; lastKnownScrollTop = screenWrap.scrollTop; updateScrollFab(); }, smooth ? 260 : 20);
  }

  function renderScreenFrame(msg, forceBottom) {
    if (msg.data === lastRawScreen && !forceBottom) return;
    const prevTop = screenWrap.scrollTop;
    lastRawScreen = msg.data;
    ptyScrollOffset = msg.scroll_offset || 0;
    screenStage.style.display = "";
    dormantBox.style.display = "none";
    screenEl.innerHTML = renderTerminalHTML(msg.data);
    applyTerminalScale();

    if ((forceBottom || userPinBottom) && !ptyScrollOffset) {
      scrollToBottomNow(false);
    } else {
      programmaticScroll = true;
      screenWrap.scrollTop = prevTop;
      lastKnownScrollTop = screenWrap.scrollTop;
      programmaticScroll = false;
    }
    updateScrollFab();
  }

  function connectPTY(runID) {
    if (ptyWS) { try { ptyWS.close(); } catch (_) {} ptyWS = null; }
    ptyScrollOffset = 0;
    lastRawScreen = "";
    pendingScreenMsg = null;
    userPinBottom = true;
    dormantBox.style.display = "none";
    screenStage.style.display = "";
    screenEl.textContent = "正在连接实时终端...";
    updateScrollFab();

    const ws = new WebSocket(wsURL(`/ws/runs/${encodeURIComponent(runID)}/pty?full=1`));
    ptyWS = ws;
    let firstFrame = true;
    ws.onmessage = (ev) => {
      if (ptyWS !== ws) return;
      const msg = JSON.parse(ev.data);
      if (msg.type === "screen" && typeof msg.data === "string") {
        if (firstFrame) {
          firstFrame = false;
          renderScreenFrame(msg, true);
          return;
        }
        // Never mutate DOM while finger is actively dragging on mobile!
        if (isTouching) {
          pendingScreenMsg = msg;
          return;
        }
        renderScreenFrame(msg, false);
      } else if (msg.type === "closed") {
        showDormant();
      }
    };
    ws.onerror = () => { if (ptyWS === ws) showDormant(); };
    ws.onclose = () => { if (ptyWS === ws && !lastRawScreen) showDormant(); };
  }

  function showDormant() {
    const r = findRun(activeRunID);
    if (!lastRawScreen) screenStage.style.display = "none";
    $("dormantDesc").textContent = r && r.session_id
      ? `已绑定 Session (${r.session_id.slice(0, 12)}…)，点击即可无缝续聊`
      : "点击下方按钮恢复或启动新的交互终端";
    dormantBox.style.display = "block";
  }

  function updateScrollFab() {
    const farUp = !userPinBottom && distFromBottom() > 80;
    if (ptyScrollOffset > 0) {
      scrollFabText.textContent = `回看 -${ptyScrollOffset} 行 · 回底`;
      scrollFab.classList.add("show");
    } else if (farUp) {
      scrollFabText.textContent = "回到底部";
      scrollFab.classList.add("show");
    } else {
      scrollFab.classList.remove("show");
    }
  }
  scrollFab.onclick = () => {

    scrollToBottomNow(true);
  };

  function connectEvents() {
    if (sessionRevoked) return;
    if (evWS) { try { evWS.close(); } catch (_) {} }
    evWS = new WebSocket(wsURL("/ws/events"));
    evWS.onmessage = () => fetchState();
    evWS.onclose = () => {
      if (sessionRevoked) return;
      // Probe auth state so a kicked session surfaces immediately instead of looping silently.
      fetchState().then(() => {
        if (!sessionRevoked) setTimeout(connectEvents, 2000);
      });
    };
  }

  function sendRaw(str) {
    if (!ptyWS || ptyWS.readyState !== WebSocket.OPEN) { showToast("终端未连接，请先恢复会话"); return; }
    ptyWS.send(JSON.stringify({ type: "input", data: b64EncodeUTF8(str) }));
  }
  function sendPaste(str) {
    if (!ptyWS || ptyWS.readyState !== WebSocket.OPEN) { showToast("终端未连接，请先恢复会话"); return; }
    ptyWS.send(JSON.stringify({ type: "paste", data: b64EncodeUTF8(str) }));
  }
  function sendScroll(delta) {
    if (!ptyWS || ptyWS.readyState !== WebSocket.OPEN) return;
    ptyWS.send(JSON.stringify({ type: "scroll", delta }));
  }

        </div>
        <div class="stat-box ${taskFilter === "waiting" ? "active" : ""}" data-filter="waiting">
          <div class="stat-num" style="color:var(--amber)">${cntWait}</div>
          <div class="stat-lbl">待确认</div>
        </div>
      </div>`;

    const projects = state.projects || [];
    if (projects.length === 0) {
      html += `<div class="empty-state">工作台还没有项目。<br>请先在电脑端按 <strong>p</strong> 添加本地目录。</div>`;
      root.innerHTML = html;
      return;
    }

    let renderedAny = false;
    for (const p of projects) {
      const pTasks = (state.tasks || []).filter((t) => t.project_id === p.id);
      const visibleTasks = pTasks.filter((t) => {
        const tr = runs.filter((r) => r.task_id === t.id);
        if (taskFilter === "running") return tr.some((r) => r.status === "running" || r.status === "starting");
        if (taskFilter === "waiting") return tr.some((r) => r.status === "waiting_input");
        return true;
      });
      if (visibleTasks.length === 0 && taskFilter !== "all") continue;
      renderedAny = true;

      html += `<div class="sec-head"><span>${escapeHTML(p.name)}</span><span class="sec-sub">${p.is_multi_repo ? "多仓" : (p.is_git_repo ? "Git" : "目录")}</span></div>`;
      if (visibleTasks.length === 0) {
        html += `<div class="card" style="color:var(--muted);font-size:12.5px">暂无任务，点击右上角「新建任务」启动 Agent</div>`;
      }
      for (const t of visibleTasks) {
        const tr = runs.filter((r) => r.task_id === t.id).filter((r) => {
          if (taskFilter === "running") return r.status === "running" || r.status === "starting";
          if (taskFilter === "waiting") return r.status === "waiting_input";
          return true;
        });
        html += `<div class="card">
          <div class="task-title-row">
            <span class="task-title">${escapeHTML(t.title)}</span>
            <span class="task-mode">${t.mode === "compare" ? "多Agent对比" : "单任务"}</span>
          </div>`;
        for (const r of tr) {
          const isSel = r.id === activeRunID;
          html += `
            <div class="run-row ${isSel ? "selected" : ""}" data-run="${escapeHTML(r.id)}">
              <div class="run-row-left">
                <span class="dot ${r.status}"></span>
                <span class="agent-chip ${r.agent}">${escapeHTML(r.agent)}</span>
                <span class="status-pill ${r.status}">${statusText[r.status] || r.status}</span>
              </div>
              <div class="run-row-right">
                ${r.status === "stopped" ? `<button class="mini-pill" data-act="resume" data-run="${escapeHTML(r.id)}">恢复</button>` : ""}
                <svg class="ico ico-sm" style="color:var(--muted)" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
              </div>
            </div>`;
        }
        html += `</div>`;
      }
    }
    if (!renderedAny) {
      html += `<div class="empty-state">当前筛选下没有匹配的会话</div>`;
    }
    root.innerHTML = html;

    const nb = $("openNewTaskBtn");
    if (nb) nb.onclick = openNewTaskSheet;
    root.querySelectorAll(".stat-box").forEach((el) => {
      el.onclick = () => { taskFilter = el.dataset.filter; renderTasksPage(); };
    });
    root.querySelectorAll(".run-row").forEach((el) => {
      el.onclick = (ev) => {
        if (ev.target.dataset && ev.target.dataset.act === "resume") {
          ev.stopPropagation();
          selectRun(el.dataset.run);
          switchTab("term");
          restartActiveRun("auto");
          return;
        }
        selectRun(el.dataset.run);
        switchTab("term");
      };
    });
  }

  // --- TAB 3: Diff Page ---
  async function loadDiffPage() {
    const root = $("diffPage");
    const r = findRun(activeRunID);
    if (!r) {
      root.innerHTML = `<div class="empty-state">请先在「任务」页选择一个 Agent 会话查看 Diff</div>`;
      return;
    }
    root.innerHTML = `<div class="empty-state">正在计算工作区 Diff...</div>`;
    try {
      const res = await apiFetch(`/api/tasks/${encodeURIComponent(r.task_id)}/diff`);
      if (!res.ok) { root.innerHTML = `<div class="empty-state">读取 Diff 失败 (${res.status})</div>`; return; }
      diffCache = await res.json();
      const idx = (diffCache.runs || []).findIndex((x) => x.run_id === activeRunID);
      diffRunIdx = idx >= 0 ? idx : 0;
      renderDiffPage();
    } catch (e) {
      root.innerHTML = `<div class="empty-state">网络错误：${escapeHTML(e.message)}</div>`;
    }
  }

  function renderDiffPage() {
    const root = $("diffPage");
    if (!diffCache || !diffCache.runs || diffCache.runs.length === 0) {
      root.innerHTML = `<div class="empty-state">暂无代码变更</div>`;
      return;
    }
    const cur = diffCache.runs[diffRunIdx] || diffCache.runs[0];
    let tabsHTML = diffCache.runs.map((dr, i) => `
      <button class="icon-btn ${i === diffRunIdx ? "active" : ""}" data-didx="${i}" style="height:32px;border-radius:999px">
        ${escapeHTML(dr.agent)} (+${dr.added}/-${dr.deleted})
      </button>`).join("");

    let filesHTML = (cur.files || []).length === 0
      ? `<div style="color:var(--muted);font-size:12.5px">工作区干净，暂无未提交改动</div>`
      : cur.files.map((f) => `
        <div class="diff-file">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHTML(f.path)}</span>
          <span style="flex-shrink:0"><span style="color:var(--green)">+${f.added}</span> <span style="color:var(--red)">-${f.deleted}</span></span>
        </div>`).join("");

    const diffLines = (cur.diff || "").split("\n").slice(0, 800).map((line) => {
      let cls = "dl-ctx";
      if (line.startsWith("+") && !line.startsWith("+++")) cls = "dl-add";
      else if (line.startsWith("-") && !line.startsWith("---")) cls = "dl-del";
      else if (line.startsWith("@@") || line.startsWith("diff --git")) cls = "dl-hunk";
      return `<span class="${cls}">${escapeHTML(line || " ")}</span>`;
    }).join("");

    root.innerHTML = `
      <div class="page-title-bar">
        <div class="page-title">代码变更 Diff</div>
        <button class="ghost-btn" id="diffReloadBtn">刷新</button>
      </div>
      <div class="diff-tabs">${tabsHTML}</div>
      <div class="card">
        <div style="font-size:12px;font-weight:700;color:var(--sky);margin-bottom:6px">变更文件 (${(cur.files || []).length})</div>
        ${filesHTML}
      </div>
      <pre class="diff-code">${diffLines || '<span class="dl-ctx">（暂无 Diff 内容）</span>'}</pre>`;

    $("diffReloadBtn").onclick = loadDiffPage;
    root.querySelectorAll("[data-didx]").forEach((b) => {
      b.onclick = () => { diffRunIdx = Number(b.dataset.didx); renderDiffPage(); };
    });
  }

  // --- TAB 4: Quota Page ---
  function renderQuotaPage() {
    const root = $("quotaPage");
    const quotas = state.quotas || [];
    let html = `
      <div class="page-title-bar">
        <div class="page-title">实时额度</div>
        <button class="ghost-btn" id="quotaRefreshBtn">静默刷新</button>
      </div>`;

    if (quotas.length === 0) {
      html += `<div class="empty-state">暂无额度数据，请先开启任意 Agent 会话。</div>`;
    } else {
      for (const q of quotas) {
        const pct = typeof q.remaining_pct === "number" ? Math.max(0, Math.min(100, q.remaining_pct)) : null;
        const barCls = q.state === "limited" ? "limited" : (q.state === "low" ? "low" : "");
        const stColor = q.state === "limited" ? "var(--red)" : (q.state === "low" ? "var(--amber)" : (q.state === "ok" ? "var(--green)" : "var(--muted)"));
        html += `
          <div class="card">
            <div class="quota-head">
              <span class="agent-chip ${q.agent}" style="font-size:12px;padding:3px 10px">${escapeHTML(q.agent)}</span>
              <span class="quota-sum" style="color:${stColor}">${escapeHTML(q.summary || "")}</span>
            </div>
            ${pct !== null ? `<div class="bar-track"><div class="bar-fill ${barCls}" style="width:${pct}%"></div></div>` : ""}
            ${q.detail ? `<div class="quota-detail">${escapeHTML(q.detail)}</div>` : ""}
          </div>`;
      }
    }
    root.innerHTML = html;
    $("quotaRefreshBtn").onclick = async () => {
      $("quotaRefreshBtn").textContent = "刷新中...";
      await apiFetch("/api/quota/probe", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}"
      });
      await fetchState();
      showToast("已触发后台额度刷新");
    };
  }

  // --- New Task Bottom Sheet ---
  let ntSelectedAgents = new Set();
  let ntPerm = "default";
  function openNewTaskSheet() {
    const projs = state.projects || [];
    if (projs.length === 0) { showToast("请先在电脑端按 p 添加项目"); return; }
    const sel = $("ntProject");
    sel.innerHTML = projs.map((p) => `<option value="${escapeHTML(p.id)}">${escapeHTML(p.name)}</option>`).join("");
    const curRun = findRun(activeRunID);
    if (curRun && curRun.project_id) sel.value = curRun.project_id;

    $("ntTitle").value = "";
    $("ntPrompt").value = "";
    ntSelectedAgents = new Set();
    const avail = (state.agents || []).filter((a) => a.available);
    if (avail.length > 0) ntSelectedAgents.add(avail[0].name);

    const agWrap = $("ntAgents");
    agWrap.innerHTML = (state.agents || []).map((a) =>
      `<button type="button" class="check-chip ${ntSelectedAgents.has(a.name) ? "on" : ""} ${a.available ? "" : "disabled"}" data-ag="${escapeHTML(a.name)}">${escapeHTML(a.label)}${a.available ? "" : " (未装)"}</button>`
    ).join("");
    agWrap.querySelectorAll(".check-chip").forEach((b) => {
      b.onclick = () => {
        const name = b.dataset.ag;
        if (ntSelectedAgents.has(name)) ntSelectedAgents.delete(name);
        else ntSelectedAgents.add(name);
        b.classList.toggle("on", ntSelectedAgents.has(name));
      };
    });

    const perms = [["default", "默认"], ["auto", "自动编辑"], ["plan", "仅规划"], ["yolo", "全自动"]];
    const pWrap = $("ntPerms");
    pWrap.innerHTML = perms.map(([k, lbl]) =>
      `<button type="button" class="check-chip ${ntPerm === k ? "on" : ""}" data-perm="${k}">${lbl}</button>`
    ).join("");
    pWrap.querySelectorAll(".check-chip").forEach((b) => {
      b.onclick = () => {
        ntPerm = b.dataset.perm;
        pWrap.querySelectorAll(".check-chip").forEach((x) => x.classList.toggle("on", x.dataset.perm === ntPerm));
      };
    });

    $("newTaskBackdrop").classList.add("open");
  }
  $("newTaskCloseBtn").onclick = () => $("newTaskBackdrop").classList.remove("open");
  $("newTaskBackdrop").onclick = (e) => { if (e.target === $("newTaskBackdrop")) $("newTaskBackdrop").classList.remove("open"); };
  $("ntSubmitBtn").onclick = async () => {
    const projectID = $("ntProject").value;
    const title = $("ntTitle").value.trim() || "手机任务";
    const prompt = $("ntPrompt").value.trim();
    const agents = Array.from(ntSelectedAgents);
    if (agents.length === 0) { showToast("请至少选择一个已安装的 Agent"); return; }
    $("ntSubmitBtn").textContent = "创建中...";
    try {
      const res = await apiFetch("/api/tasks", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ project_id: projectID, title, prompt, agents, perm_mode: ntPerm })
      });
      if (!res.ok) { showToast("创建任务失败"); return; }
      const created = await res.json();
      $("newTaskBackdrop").classList.remove("open");
      await fetchState();
      if (created.runs && created.runs.length > 0) {
        selectRun(created.runs[0].id);
        switchTab("term");
      }
      showToast("任务已创建并启动");
    } finally {
      $("ntSubmitBtn").textContent = "创建并启动";
    }
  };

  // --- Voice Input Engine ---
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  let speechRec = null;
  let mediaRec = null;
  let mediaChunks = [];
  let isListening = false;
  let voiceFinalText = "";
  let voiceInterimText = "";
  let voiceLang = localStorage.getItem("aio_m_vlang") || "zh-CN";
  let voiceAutoSend = localStorage.getItem("aio_m_vauto") === "1";

  $("voiceLangBtn").textContent = voiceLang.startsWith("zh") ? "中文" : "EN";
  $("voiceAutoSend").checked = voiceAutoSend;
  $("voiceAutoSend").onchange = () => {
    voiceAutoSend = $("voiceAutoSend").checked;
    localStorage.setItem("aio_m_vauto", voiceAutoSend ? "1" : "0");
  };
  $("voiceLangBtn").onclick = () => {
    voiceLang = voiceLang.startsWith("zh") ? "en-US" : "zh-CN";
    localStorage.setItem("aio_m_vlang", voiceLang);
    $("voiceLangBtn").textContent = voiceLang.startsWith("zh") ? "中文" : "EN";
    if (isListening && speechRec) { stopVoice(); setTimeout(startVoice, 150); }
  };

  function renderVoiceTranscript() {
    const box = $("voiceTranscript");
    if (!voiceFinalText && !voiceInterimText) {
      box.innerHTML = `<span style="color:var(--muted)">点击下方按钮开始说话，识别结果将实时显示在这里...</span>`;
      return;
    }
    box.innerHTML = escapeHTML(voiceFinalText) + (voiceInterimText ? `<span class="voice-interim">${escapeHTML(voiceInterimText)}</span>` : "");
  }

  function setVoiceUIListening(on, statusMsg) {
    isListening = on;
    $("voiceBtn").classList.toggle("recording", on);
    $("voiceWave").classList.toggle("idle", !on);
    $("voiceStatusLine").textContent = statusMsg || (on ? "正在聆听，请直接说话..." : "已暂停");
    $("voiceRecToggleBtn").textContent = on ? "停止说话" : "开始说话";
    $("voiceRecToggleBtn").classList.toggle("btn-danger", on);
  }

  function openVoiceSheet() {
    voiceFinalText = promptEl.value.trim();
    voiceInterimText = "";
    renderVoiceTranscript();
    const help = $("voiceHelpArea");
    const secure = window.isSecureContext;
    const canWebSpeech = secure && !!SpeechRec;
    const canMediaRec = secure && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && caps.voice_transcribe;

    if (canWebSpeech) {
      help.style.display = "none";
      $("voiceModeHint").textContent = "浏览器原生实时语音";
      $("voiceSheetBackdrop").classList.add("open");
      startWebSpeech();
      return;
    }
    if (canMediaRec) {
      help.style.display = "none";
      $("voiceModeHint").textContent = "录音 + 服务端转写";
      $("voiceSheetBackdrop").classList.add("open");
      startMediaRecording();
      return;
    }

    $("voiceModeHint").textContent = secure ? "浏览器无语音接口" : "HTTP 安全限制";
    let h = `<div class="tip-card">`;
    if (!secure) {
      h += `当前通过普通 <strong>HTTP</strong> 局域网访问，浏览器默认屏蔽网页麦克风。<br><br>`;
      h += `<strong>方式 1（立刻可用）</strong>：点下方聚焦输入框，使用手机输入法自带的<strong>语音听写键</strong>；<br>`;
      h += `<strong>方式 2（开启网页实时语音）</strong>：在电脑端 <code>aio</code> 的 <strong>M</strong> 弹窗按 <strong>h</strong> 切换为 <strong>HTTPS</strong> 重新扫码。`;
    } else {
      h += `当前手机浏览器未开放 Web Speech 语音接口，可使用手机输入法自带语音键，或在 <code>~/.aio/config.toml</code> 配置 <code>voice_transcribe_cmd</code>。`;
    }
    h += `</div><div style="display:flex;gap:8px;margin-top:8px">
      <button class="icon-btn btn-primary" style="flex:1;height:40px;border-radius:12px" id="voiceFocusKbdBtn">唤起输入法语音键</button>
      ${caps.voice_transcribe ? `<button class="icon-btn" style="flex:1;height:40px;border-radius:12px" id="voiceUploadAudioBtn">系统录音转写</button>` : ""}
    </div>`;
    help.innerHTML = h;
    help.style.display = "block";
    setVoiceUIListening(false, "请选择语音输入方式");
    $("voiceSheetBackdrop").classList.add("open");

    $("voiceFocusKbdBtn").onclick = () => {
      closeVoiceSheet();
      promptEl.focus();
      showToast("已聚焦输入框，请点手机键盘上的语音键");
    };
    const upBtn = $("voiceUploadAudioBtn");
    if (upBtn) upBtn.onclick = () => $("audioUploadInput").click();
  }

  function startWebSpeech() {
    if (!SpeechRec) return;
    try {
      const rec = new SpeechRec();
      rec.lang = voiceLang;
      rec.continuous = true;
      rec.interimResults = true;
      rec.onstart = () => setVoiceUIListening(true, `正在聆听 (${voiceLang.startsWith("zh") ? "中文" : "English"})...`);
      rec.onresult = (ev) => {
        let interim = "";
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          const t = ev.results[i][0].transcript;
          if (ev.results[i].isFinal) {
            voiceFinalText = (voiceFinalText ? voiceFinalText + " " : "") + t.trim();
          } else {
            interim += t;
          }
        }
        voiceInterimText = interim;
        renderVoiceTranscript();
      };
      rec.onerror = (ev) => {
        const map = {
          "not-allowed": "麦克风权限被拒绝，请在浏览器设置中允许麦克风",
          "no-speech": "未检测到说话声音，请重试",
          "network": "语音识别服务不可达，建议用输入法语音键或配置 voice_transcribe_cmd"
        };
        setVoiceUIListening(false, map[ev.error] || ("语音识别出错: " + ev.error));
      };
      rec.onend = () => {
        const hadText = (voiceFinalText + voiceInterimText).trim();
        if (voiceInterimText.trim()) {
          voiceFinalText = (voiceFinalText ? voiceFinalText + " " : "") + voiceInterimText.trim();
          voiceInterimText = "";
          renderVoiceTranscript();
        }
        const wasListening = isListening;
        setVoiceUIListening(false, hadText ? "识别完成" : "已停止");
        if (wasListening && voiceAutoSend && voiceFinalText.trim()) {
          submitVoiceAndClose();
        }
      };
      speechRec = rec;
      rec.start();
    } catch (e) {
      setVoiceUIListening(false, "启动语音失败：" + e.message);
    }
  }

  async function startMediaRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaChunks = [];
      const rec = new MediaRecorder(stream);
      rec.ondataavailable = (e) => { if (e.data && e.data.size > 0) mediaChunks.push(e.data); };
      rec.onstop = async () => {
        stream.getTracks().forEach((t) => t.stop());
        const blob = new Blob(mediaChunks, { type: rec.mimeType || "audio/webm" });
        await uploadAudioForTranscribe(blob, "recording.webm");
      };
      mediaRec = rec;
      rec.start();
      setVoiceUIListening(true, "正在录音，说完点击「停止说话」...");
    } catch (e) {
      setVoiceUIListening(false, "无法访问麦克风：" + e.message);
    }
  }

  async function uploadAudioForTranscribe(blob, filename) {
    setVoiceUIListening(false, "正在转写语音...");
    try {
      const fd = new FormData();
      fd.append("audio", blob, filename || "voice.webm");
      const res = await apiFetch("/api/voice/transcribe", { method: "POST", body: fd });
      const data = await res.json();
      if (!res.ok) {
        $("voiceStatusLine").textContent = "转写失败：" + (data.error || res.status);
        return;
      }
      if (data.text) {
        voiceFinalText = (voiceFinalText ? voiceFinalText + " " : "") + data.text.trim();
        renderVoiceTranscript();
        $("voiceStatusLine").textContent = "转写完成";
        if (voiceAutoSend) submitVoiceAndClose();
      } else {
        $("voiceStatusLine").textContent = "未识别到文字";
      }
    } catch (e) {
      $("voiceStatusLine").textContent = "上传失败：" + e.message;
    }
  }

  $("audioUploadInput").onchange = (ev) => {
    const f = ev.target.files && ev.target.files[0];
    if (f) uploadAudioForTranscribe(f, f.name);
    ev.target.value = "";
  };

  function startVoice() {
    if (window.isSecureContext && SpeechRec) startWebSpeech();
    else if (window.isSecureContext && navigator.mediaDevices && caps.voice_transcribe) startMediaRecording();
    else openVoiceSheet();
  }
  function stopVoice() {
    isListening = false;
    if (speechRec) { try { speechRec.stop(); } catch (_) {} speechRec = null; }
    if (mediaRec && mediaRec.state !== "inactive") { try { mediaRec.stop(); } catch (_) {} mediaRec = null; }
    setVoiceUIListening(false, "已停止");
  }
  function closeVoiceSheet() {
    stopVoice();
    $("voiceSheetBackdrop").classList.remove("open");
  }
  function submitVoiceAndClose() {
    const txt = (voiceFinalText + (voiceInterimText ? " " + voiceInterimText : "")).trim();
    closeVoiceSheet();
    if (!txt) { showToast("暂无语音内容"); return; }
    submitTextToAgent(txt);
    promptEl.value = "";
    promptEl.style.height = "34px";
    showToast("已发送语音指令");
  }

  $("voiceBtn").onclick = openVoiceSheet;
  $("voiceCloseBtn").onclick = closeVoiceSheet;
  $("voiceSheetBackdrop").onclick = (e) => { if (e.target === $("voiceSheetBackdrop")) closeVoiceSheet(); };
  $("voiceRecToggleBtn").onclick = () => { if (isListening) stopVoice(); else startVoice(); };
  $("voiceFillBtn").onclick = () => {
    const txt = (voiceFinalText + (voiceInterimText ? " " + voiceInterimText : "")).trim();
    closeVoiceSheet();
    if (txt) {
      promptEl.value = txt;
      promptEl.dispatchEvent(new Event("input"));
      promptEl.focus();
    }
  };
  $("voiceSendNowBtn").onclick = submitVoiceAndClose;

  // --- Boot ---
  applyTerminalScale();
  fetchCaps();
  fetchState();
  connectEvents();
})();
</script>
</body>
</html>
