<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bg" x1="32" y1="24" x2="480" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#060A14"/>
    </linearGradient>
    <linearGradient id="ring" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="core" x1="176" y1="152" x2="336" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="52%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#22D3EE" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App Icon Squircle Frame -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="106.5" stroke="#334155" stroke-opacity="0.65" stroke-width="3"/>

  <!-- Subtle Radial Aura -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- Orbital Convergence Ring -->
  <circle cx="256" cy="256" r="144" stroke="url(#ring)" stroke-width="4" stroke-dasharray="10 10" stroke-linecap="round"/>

  <!-- Spokes linking the 4 Agent Nodes to the Unified Core -->
  <g stroke="#334155" stroke-width="5" stroke-linecap="round">
    <line x1="256" y1="112" x2="256" y2="168"/>
    <line x1="400" y1="256" x2="344" y2="256"/>
    <line x1="256" y1="400" x2="256" y2="344"/>
    <line x1="112" y1="256" x2="168" y2="256"/>
  </g>

  <!-- Central Geometric Diamond Prism (All-in-One Hub) -->
  <path d="M256 146 L354 256 L256 366 L158 256 Z" fill="#0F172A" stroke="url(#core)" stroke-width="10" stroke-linejoin="round"/>
  <path d="M256 184 L318 256 L256 328 L194 256 Z" fill="url(#core)" fill-opacity="0.18"/>

  <!-- Crisp Terminal Prompt Chevron inside the Core -->
  <path d="M226 232 L254 256 L226 280" stroke="#F8FAFC" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="264" y1="280" x2="292" y2="280" stroke="#34D399" stroke-width="12" stroke-linecap="round"/>

  <!-- 4 Signature Multi-Agent Orbital Nodes -->
  <!-- Top: Sky Indigo (Antigravity) -->
  <circle cx="256" cy="112" r="20" fill="#0B1120" stroke="#60A5FA" stroke-width="7"/>
  <circle cx="256" cy="112" r="7" fill="#60A5FA"/>

  <!-- Right: Emerald (Codex) -->
  <circle cx="400" cy="256" r="20" fill="#0B1120" stroke="#34D399" stroke-width="7"/>
  <circle cx="400" cy="256" r="7" fill="#34D399"/>

  <!-- Bottom: Violet (Cursor) -->
  <circle cx="256" cy="400" r="20" fill="#0B1120" stroke="#A78BFA" stroke-width="7"/>
  <circle cx="256" cy="400" r="7" fill="#A78BFA"/>

  <!-- Left: Warm Orange (Claude) -->
  <circle cx="112" cy="256" r="20" fill="#0B1120" stroke="#FB923C" stroke-width="7"/>
  <circle cx="112" cy="256" r="7" fill="#FB923C"/>
</svg>
